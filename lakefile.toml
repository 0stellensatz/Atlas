name = "Atlas"
version = "0.1.0"
description = "Formal questions posed against a curated knowledge layer, and the answers to them."
keywords = ["math", "formalization", "knowledge-base"]
homepage = "https://github.com/0stellensatz/Atlas"
license = "Apache-2.0"
defaultTargets = ["Atlas"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # no copyright header here; see `__docs__/rules-comments.md`
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

[[lean_lib]]
name = "Atlas"
